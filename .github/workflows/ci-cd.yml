name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevents the entire job from hanging for hours

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # --- Backend Checks ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test Backend
        working-directory: ./backend
        timeout-minutes: 3
        # CI=true forces Jest/Vitest to run once and exit without entering watch mode
        run: npm run test --if-present -- --passWithNoTests
        env:
          CI: true

      # --- Frontend Checks ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Test Frontend
        working-directory: ./frontend
        timeout-minutes: 3
        run: npm run test --if-present -- --passWithNoTests
        env:
          CI: true

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  # ==========================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Backend Deployment
        if: ${{ secrets.BACKEND_DEPLOY_HOOK != '' }}
        run: |
          curl -X POST "${{ secrets.BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Frontend Deployment
        if: ${{ secrets.FRONTEND_DEPLOY_HOOK != '' }}
        run: |
          curl -X POST "${{ secrets.FRONTEND_DEPLOY_HOOK }}"
