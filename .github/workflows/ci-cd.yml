name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint and Test (Optional)
        run: |
          npm run test --if-present
          npm run lint --if-present

      - name: Build Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

  # ==========================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Example A: Deploying via Webhook (Render / Railway / DigitalOcean App Platform)
      - name: Trigger Backend Deployment
        run: |
          curl -X POST ${{ secrets.BACKEND_DEPLOY_HOOK }}

      - name: Trigger Frontend Deployment
        run: |
          curl -X POST ${{ secrets.FRONTEND_DEPLOY_HOOK }}

      # Example B: Deploying Frontend directly to Vercel (Uncomment if using Vercel)
      # - name: Deploy Frontend to Vercel
      #   uses: amondnet/vercel-action@v20
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     vercel-args: '--prod'
