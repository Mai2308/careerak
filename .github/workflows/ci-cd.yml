name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # CONTINUOUS INTEGRATION (CI)
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevents the job from hanging indefinitely

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

    # --- Backend Checks ---
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Test Backend
        working-directory: ./backend
        timeout-minutes: 3
        run: npm test --if-present
        env:
          CI: true

      # --- Frontend Checks ---
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Test Frontend
        working-directory: ./frontend
        timeout-minutes: 3
        run: npm test --if-present
        env:
          CI: true

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
